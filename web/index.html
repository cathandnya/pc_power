<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Front Panel Bridge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 1.3rem;
    margin-bottom: 20px;
    color: #ccc;
  }

  /* Status card */
  .status-card {
    background: #16213e;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
  }
  .status-row + .status-row {
    border-top: 1px solid #1e2d4a;
  }
  .status-label {
    font-size: 0.9rem;
    color: #999;
  }
  .status-value {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }

  /* Indicators */
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #444;
    transition: background 0.15s;
  }
  .dot.on {
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
  }
  .dot.hdd {
    background: #444;
  }
  .dot.hdd.on {
    background: #f59e0b;
    box-shadow: 0 0 8px #f59e0b;
  }
  .dot.beep {
    background: #444;
  }
  .dot.beep.on {
    background: #f87171;
    box-shadow: 0 0 8px #f87171;
  }

  /* Connection status */
  .conn-bar {
    text-align: center;
    font-size: 0.75rem;
    color: #666;
    margin-bottom: 16px;
  }
  .conn-bar .ws-ok { color: #4ade80; }
  .conn-bar .ws-err { color: #f87171; }

  /* Buttons */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
  }
  .btn-on { background: #166534; color: #fff; }
  .btn-on:hover:not(:disabled) { background: #15803d; }
  .btn-off { background: #991b1b; color: #fff; }
  .btn-off:hover:not(:disabled) { background: #b91c1c; }
  .btn-reset { background: #92400e; color: #fff; }
  .btn-reset:hover:not(:disabled) { background: #a16207; }

  .error {
    text-align: center;
    color: #f87171;
    font-size: 0.85rem;
    margin-top: 12px;
    min-height: 1.2em;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Front Panel Bridge</h1>

  <div class="conn-bar" id="connBar">接続中...</div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">電源</span>
      <span class="status-value">
        <span class="dot" id="dotPower"></span>
        <span id="txtPower">--</span>
      </span>
    </div>
    <div class="status-row">
      <span class="status-label">ディスクアクセス</span>
      <span class="status-value">
        <span class="dot hdd" id="dotHdd"></span>
        <span id="txtHdd">--</span>
      </span>
    </div>
    <div class="status-row">
      <span class="status-label">ビープ</span>
      <span class="status-value">
        <span class="dot beep" id="dotBeep"></span>
        <span id="txtBeep">--</span>
      </span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-on" id="btnOn" onclick="send('/power/on')" disabled>Power ON</button>
    <button class="btn btn-off" id="btnOff" onclick="send('/power/off')" disabled>Power OFF</button>
    <button class="btn btn-reset" id="btnReset" onclick="send('/reset')" disabled>Reset</button>
  </div>

  <div class="error" id="error"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let ws = null;
  let reconnectTimer = null;

  function updateUI(data) {
    // Power
    $('dotPower').className = 'dot' + (data.pc_power ? ' on' : '');
    $('txtPower').textContent = data.pc_power ? 'ON' : 'OFF';

    // HDD
    $('dotHdd').className = 'dot hdd' + (data.hdd_active ? ' on' : '');
    $('txtHdd').textContent = data.hdd_active ? 'Active' : 'Idle';

    // Beep
    $('dotBeep').className = 'dot beep' + (data.beep ? ' on' : '');
    $('txtBeep').textContent = data.beep ? 'ON' : '--';

    // Buttons
    const enabled = !data.busy;
    $('btnOn').disabled = !enabled;
    $('btnOff').disabled = !enabled;
    $('btnReset').disabled = !enabled;
  }

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onopen = () => {
      $('connBar').innerHTML = '<span class="ws-ok">WebSocket 接続中</span>';
      $('error').textContent = '';
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      updateUI(data);
    };

    ws.onclose = () => {
      $('connBar').innerHTML = '<span class="ws-err">切断 - 再接続中...</span>';
      setButtons(false);
      scheduleReconnect();
    };

    ws.onerror = () => {
      ws.close();
    };
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connectWS();
    }, 2000);
  }

  function setButtons(enabled) {
    $('btnOn').disabled = !enabled;
    $('btnOff').disabled = !enabled;
    $('btnReset').disabled = !enabled;
  }

  async function send(path) {
    setButtons(false);
    $('error').textContent = '';
    try {
      const res = await fetch(path, { method: 'POST' });
      const data = await res.json();
      updateUI(data);
    } catch (e) {
      $('error').textContent = '操作に失敗しました';
    }
  }

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }

  // Start
  connectWS();
</script>

</body>
</html>
