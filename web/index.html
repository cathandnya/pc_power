<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<title>Front Panel Bridge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 1.3rem;
    margin-bottom: 20px;
    color: #ccc;
  }

  /* Status indicators */
  .indicators {
    display: flex;
    justify-content: center;
    gap: 36px;
    background: #16213e;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .indicator i {
    font-size: 24px;
    color: #444;
    transition: color 0.15s, filter 0.15s;
  }
  .indicator i.on {
    color: #4ade80;
    filter: drop-shadow(0 0 8px #4ade80);
  }
  .indicator i.hdd.on {
    color: #f59e0b;
    filter: drop-shadow(0 0 8px #f59e0b);
  }
  .indicator i.beep.on {
    color: #f87171;
    filter: drop-shadow(0 0 8px #f87171);
  }

  /* Buttons */
  .actions {
    display: flex;
    gap: 10px;
  }
  .btn {
    flex: 1;
    padding: 18px;
    border: none;
    border-radius: 10px;
    font-size: 1.4rem;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.95); }
  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
  }
  .btn-on { background: #1e3a5f; color: #fff; }
  .btn-on:hover:not(:disabled) { background: #254b78; }
  .btn-off { background: #1e3a5f; color: #fff; }
  .btn-off:hover:not(:disabled) { background: #254b78; }
  .btn-reset { background: #1a2d4a; color: #fff; }
  .btn-reset:hover:not(:disabled) { background: #213a5c; }
  .btn-force { background: transparent; color: #666; border: 1px solid #333; font-size: 0.8rem; }
  .btn-force:hover:not(:disabled) { color: #f87171; border-color: #f87171; }

  .error {
    text-align: center;
    color: #f87171;
    font-size: 0.85rem;
    margin-top: 12px;
    min-height: 1.2em;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Front Panel Bridge</h1>


  <div class="indicators">
    <div class="indicator">
      <i class="fa-solid fa-power-off" id="icoPower"></i>
    </div>
    <div class="indicator">
      <i class="fa-solid fa-hard-drive hdd" id="icoHdd"></i>
    </div>
    <div class="indicator">
      <i class="fa-solid fa-volume-high beep" id="icoBeep"></i>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-on" id="btnPower" onclick="send('/power/toggle')" style="flex:2"><i class="fa-solid fa-power-off"></i></button>
    <button class="btn btn-reset" id="btnReset" onclick="send('/reset')"><i class="fa-solid fa-arrows-rotate"></i></button>
  </div>
  <div class="actions" style="margin-top:10px">
    <button class="btn btn-force" id="btnForce" onclick="confirmForceOff()"><i class="fa-solid fa-plug-circle-xmark" style="margin-right:6px"></i>Force OFF</button>
  </div>

  <div class="error" id="error"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let ws = null;
  let reconnectTimer = null;

  let pcPower = false;

  function updateUI(data) {
    pcPower = data.pc_power;
    $('icoPower').className = 'fa-solid fa-power-off' + (pcPower ? ' on' : '');
    $('icoHdd').className = 'fa-solid fa-hard-drive hdd' + (data.hdd_active ? ' on' : '');
    $('icoBeep').className = 'fa-solid fa-volume-high beep' + (data.beep ? ' on' : '');

    const busy = data.busy;
    $('btnPower').disabled = busy;
    $('btnReset').disabled = busy;
    $('btnForce').disabled = busy;
  }

  function confirmForceOff() {
    if (confirm('強制シャットダウンしますか？')) {
      send('/power/off');
    }
  }

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onopen = () => {
      $('error').textContent = '';
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      updateUI(data);
    };

    ws.onclose = () => {
      scheduleReconnect();
    };

    ws.onerror = () => {
      ws.close();
    };
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connectWS();
    }, 2000);
  }

  function setButtons(enabled) {
    $('btnPower').disabled = !enabled;
    $('btnReset').disabled = !enabled;
    $('btnForce').disabled = !enabled;
  }

  async function send(path) {
    setButtons(false);
    $('error').textContent = '';
    try {
      const res = await fetch(path, { method: 'POST' });
      const data = await res.json();
      updateUI(data);
    } catch (e) {
      $('error').textContent = '操作に失敗しました';
    }
  }

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }

  // Start
  connectWS();
</script>

</body>
</html>
